<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dinner Randomizer</title>
    <link rel="icon" type="image/png" href="dinner.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="dinner.png">
  </head>
  <body>
    <h1>Dinner Randomizer</h1>
    <div id="week"></div>
    <button onclick="randomizeDinners()">Randomize Dinners</button>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 800px;
        margin: 24px auto;
      }
      .calendar-day {
        background: #f8f8f8;
        border-radius: 8px;
        box-shadow: 0 2px 6px #ccc;
        padding: 16px;
        text-align: center;
        font-size: 1.1em;
      }
      .calendar-special {
        grid-column: span 3;
        background: #e0f7fa;
        margin-top: 8px;
      }
      button {
        background: #f8f8f8;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 6px #ccc;
        padding: 16px 32px;
        font-size: 1.1em;
        cursor: pointer;
        margin: 24px auto;
        display: block;
        transition: background-color 0.2s;
      }
      button:hover {
        background: #efefef;
      }
    </style>
    <script>
      // Embedded lists
      const lists = {
        "Monday": ["Chicken Alfredo", "Chicken Parmesan Baked Ziti", "Spaghetti", "Mac and Cheese", "Mac and Cheese Hot Dogs", "Skillet Lasagna", "Garlic Parmesan Pasta", "Cream Cheese Bacon Chicken Pasta", "Goulash"],
        "Tuesday": ["Nacho Bar", "Tacos", "Taco Salad", "Idaho Nachos", "Quesadillas", "Chicken Salad"],
        "Wednesday": ["Stack Dinners", "Orange Chicken", "Spanish Rice", "Butter Chicken", "Garlic Chicken", "Teriyaki Chicken", "Sticky Garlic Chicken Bites"],
        "Thursday": ["Breakfast Burritos", "Omelettes", "Pancakes", "Waffles", "French Toast", "Strawberry Cream Cheese French Toast Rollups"],
        "Friday": ["Pizza Bombs", "Sloppy Joes", "Grilled Cheese", "Cheeseburgers", "Bacon Cheeseburgers", "Hot Dogs", "Chicken Wraps", "Chicken Nuggets", "Pitas", "Tortilla Pizza"],
        "Weekend": ["Philly Cheesesteaks", "Stogonoff", "Mashed Potatoes and Steak", "Potato Soup", "Wontons", "Homemade Chicken Nuggets", "Bubble Pizza", "Pigs in a Blanket", "Garlic Parmesan Chicken Tenders", "Crispy Bacon and Cheese Potatoes", "Sliders", "French Bread Pizza", "Garlic Parmesan Mac and Cheese", "Wings"],
        "Dessert": ["Cosmic Brownies", "Fluffy Air Fryer Churro Bites", "Fried Strawberry Cheesecake Sandwiches", "Cinnamon Sugar Pizza made with Crescent Rolls", "Cinnamon Roll French Toast", "No Bake Chocolate Peanut Butter Bars", "Strawberry Cream Cheese Bites", "3 Ingredient Peanut Butter Cups","Cinnamon Rolls","Pumpkin Chocolate Chip Bread"],
        "New things": ["Mongolian Ground Beef Noodles","Manicotti","Ultimate Bacon Cheeseburger Rollups","Crispy Wonton Mozzarella Sticks","Chicken Bacon Ranch Rollups","Crispy Cheese and Bacon Potatoes","Meatballs","Bacon Ranch Chicken Bake","Potato Wedges","Breakfast Quesadillas","Rosemary Chicken with Potatoes","Buttermilk Fried Chicken","Smothered Bacon Chicken", "Crack Chicken Tenders", "Fried Chicken"]
      };

      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];


      // Store current picks for each day
      let currentPicks = {};

      function pickRandom(day, exclude = null) {
        let items;
        if (day === "Saturday" || day === "Sunday") {
          items = lists["Weekend"];
        } else {
          items = lists[day];
        }
        
        // Filter out the excluded item if provided
        if (exclude !== null) {
          items = items.filter(item => item !== exclude);
        }
        
        return items[Math.floor(Math.random() * items.length)];
      }

      function randomizeDinners() {
        // Randomize all days
        days.forEach(day => {
          currentPicks[day] = pickRandom(day);
        });
        
        // Ensure Saturday and Sunday don't have the same dish
        if (currentPicks["Saturday"] === currentPicks["Sunday"]) {
          currentPicks["Sunday"] = pickRandom("Sunday", currentPicks["Saturday"]);
        }
        
        if (lists["Dessert"]) {
          currentPicks["Dessert"] = pickRandom("Dessert");
        }
        if (lists["New things"]) {
          currentPicks["New things"] = pickRandom("New things");
        }
        renderCalendar();
      }

      function randomizeDay(day) {
        currentPicks[day] = pickRandom(day);
        
        // If randomizing Saturday, check Sunday doesn't match
        if (day === "Saturday" && currentPicks["Saturday"] === currentPicks["Sunday"]) {
          currentPicks["Sunday"] = pickRandom("Sunday", currentPicks["Saturday"]);
        }
        // If randomizing Sunday, check Saturday doesn't match
        if (day === "Sunday" && currentPicks["Sunday"] === currentPicks["Saturday"]) {
          currentPicks["Saturday"] = pickRandom("Saturday", currentPicks["Sunday"]);
        }
        
        renderCalendar();
      }

      function randomizeSpecial(category) {
        currentPicks[category] = pickRandom(category);
        renderCalendar();
      }

      function renderCalendar() {
        const weekDiv = document.getElementById('week');
        weekDiv.innerHTML = '';
        const calendar = document.createElement('div');
        calendar.className = 'calendar';
        days.forEach((day, idx) => {
          const el = document.createElement('div');
          el.className = 'calendar-day';
          el.innerHTML = `<strong>${day}</strong><br>${currentPicks[day] || ''}`;
          el.style.cursor = 'pointer';
          el.title = 'Click to randomize this day';
          el.onclick = () => randomizeDay(day);
          calendar.appendChild(el);
        });
        // Dessert
        if (currentPicks["Dessert"]) {
          const el = document.createElement('div');
          el.className = 'calendar-day calendar-special';
          el.innerHTML = `<strong>Dessert:</strong> ${currentPicks["Dessert"]}`;
          el.style.cursor = 'pointer';
          el.title = 'Click to randomize dessert';
          el.onclick = () => randomizeSpecial("Dessert");
          calendar.appendChild(el);
        }
        // New things
        if (currentPicks["New things"]) {
          const el = document.createElement('div');
          el.className = 'calendar-day calendar-special';
          el.innerHTML = `<strong>New thing:</strong> ${currentPicks["New things"]}`;
          el.style.cursor = 'pointer';
          el.title = 'Click to randomize new thing';
          el.onclick = () => randomizeSpecial("New things");
          calendar.appendChild(el);
        }
        weekDiv.appendChild(calendar);
      }

      // Initial randomization
      randomizeDinners();
    </script>
  </body>
</html>
